<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="1040" viewBox="0 0 1750 1040" role="img" aria-labelledby="title desc">
  <title id="title">售后与消息同步时序图</title><desc id="desc">买家售后申请、卖家审核、聊天通知、平台介入和管理员退款的交互顺序。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8f9f5"/><stop offset="1" stop-color="#e7f2ec"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#47695e"/></marker></defs>
  <rect width="1750" height="1040" rx="32" fill="url(#bg)"/><text x="65" y="70" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="38" font-weight="800" fill="#10251f">售后与消息同步时序图</text><text x="65" y="107" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#64736d">订单状态是唯一事实源，聊天承担主动触达</text>
  <g font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle" font-size="18" font-weight="800"><g fill="#195c49"><rect x="35" y="145" width="170" height="62" rx="16"/><rect x="270" y="145" width="170" height="62" rx="16"/><rect x="505" y="145" width="170" height="62" rx="16"/><rect x="740" y="145" width="230" height="62" rx="16"/><rect x="1040" y="145" width="210" height="62" rx="16"/><rect x="1320" y="145" width="170" height="62" rx="16"/><rect x="1560" y="145" width="150" height="62" rx="16"/></g><g fill="#efffd0"><text x="120" y="184">买家</text><text x="355" y="184">卖家</text><text x="590" y="184">管理员</text><text x="855" y="184">AfterSaleService</text><text x="1145" y="184">ChatService</text><text x="1405" y="184">订单</text><text x="1635" y="184">MySQL</text></g></g>
  <g stroke="#8fa49a" stroke-width="2" stroke-dasharray="9 8"><path d="M120 207V970"/><path d="M355 207V970"/><path d="M590 207V970"/><path d="M855 207V970"/><path d="M1145 207V970"/><path d="M1405 207V970"/><path d="M1635 207V970"/></g>
  <g font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15.5" fill="#173a30" stroke="#47695e" stroke-width="2.3" marker-end="url(#a)">
    <path d="M120 270H855"/><text x="487" y="257" stroke="none" text-anchor="middle">1. 提交退款 / 退货申请</text><path d="M855 330H1405"/><text x="1130" y="317" stroke="none" text-anchor="middle">2. 锁定订单，校验付款状态和 7 天期限</text><path d="M855 390H1635"/><text x="1245" y="377" stroke="none" text-anchor="middle">3. 创建唯一售后工单，订单 → RETURN_REQUESTED</text>
    <path d="M855 465H1145"/><text x="1000" y="452" stroke="none" text-anchor="middle">4. 写入订单事件消息</text><path d="M1145 525H1635"/><text x="1390" y="512" stroke="none" text-anchor="middle">5. 卖家未读数 +1</text><path d="M355 590H855"/><text x="605" y="577" stroke="none" text-anchor="middle">6. 同意或拒绝并填写意见</text><path d="M855 645H1145"/><text x="1000" y="632" stroke="none" text-anchor="middle">7. 通知买家审核结果</text>
    <path d="M120 735H855"/><text x="487" y="722" stroke="none" text-anchor="middle">8. 双方无法一致：申请平台介入</text><path d="M855 790H1635"/><text x="1245" y="777" stroke="none" text-anchor="middle">9. 工单 → INTERVENTION</text><path d="M590 850H855"/><text x="722" y="837" stroke="none" text-anchor="middle">10. 管理员审核并执行退款</text><path d="M855 910H1635"/><text x="1245" y="897" stroke="none" text-anchor="middle">11. 支付 → REFUNDED，商品恢复 AVAILABLE</text><path d="M855 965H1145"/><text x="1000" y="952" stroke="none" text-anchor="middle">12. 通知买卖双方处理完成</text>
  </g>
  <rect x="730" y="695" width="940" height="300" rx="22" fill="#c9f26a" opacity=".11" stroke="#87a63f" stroke-width="2"/><text x="755" y="730" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="800" fill="#49611f">平台介入分支：全过程留痕、状态同步、可审计</text>
</svg>
