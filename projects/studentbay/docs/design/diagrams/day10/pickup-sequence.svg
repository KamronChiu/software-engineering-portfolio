<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="980" viewBox="0 0 1650 980" role="img" aria-labelledby="title desc">
  <title id="title">校园面交双向确认时序图</title><desc id="desc">买卖双方从面交预约、冲突检测、协商改期到双向取件码确认的交互顺序。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8f9f5"/><stop offset="1" stop-color="#e7f2ec"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#47695e"/></marker></defs>
  <rect width="1650" height="980" rx="32" fill="url(#bg)"/><text x="65" y="70" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="38" font-weight="800" fill="#10251f">校园面交双向确认时序图</text><text x="65" y="107" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#64736d">协商时间地点 · 冲突检测 · 两份凭证防止单方误确认</text>
  <g font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle" font-size="18" font-weight="800"><g fill="#195c49"><rect x="75" y="145" width="190" height="62" rx="16"/><rect x="390" y="145" width="190" height="62" rx="16"/><rect x="705" y="145" width="220" height="62" rx="16"/><rect x="1050" y="145" width="220" height="62" rx="16"/><rect x="1400" y="145" width="160" height="62" rx="16"/></g><g fill="#efffd0"><text x="170" y="184">买家</text><text x="485" y="184">卖家</text><text x="815" y="184">订单详情页</text><text x="1160" y="184">OrderService</text><text x="1480" y="184">MySQL</text></g></g>
  <g stroke="#8fa49a" stroke-width="2" stroke-dasharray="9 8"><path d="M170 207V920"/><path d="M485 207V920"/><path d="M815 207V920"/><path d="M1160 207V920"/><path d="M1480 207V920"/></g>
  <g font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#173a30" stroke="#47695e" stroke-width="2.3" marker-end="url(#a)">
    <path d="M170 270H815"/><text x="492" y="257" stroke="none" text-anchor="middle">1. 选择面交时间与校园地点</text><path d="M815 335H1160"/><text x="987" y="322" stroke="none" text-anchor="middle">2. 创建 PICKUP 订单</text><path d="M1160 400H1480"/><text x="1320" y="387" stroke="none" text-anchor="middle">3. 保存 Meeting 与双方取件码</text>
    <path d="M485 495H815"/><text x="650" y="482" stroke="none" text-anchor="middle">4. 提出改期 / 修改地点</text><path d="M815 555H1160"/><text x="987" y="542" stroke="none" text-anchor="middle">5. 提交面交修改提议</text><path d="M1160 615H1480"/><text x="1320" y="602" stroke="none" text-anchor="middle">6. 检测双方日程冲突并保存</text>
    <path d="M170 690H815"/><text x="492" y="677" stroke="none" text-anchor="middle">7. 接受修改</text><path d="M815 745H1160"/><text x="987" y="732" stroke="none" text-anchor="middle">8. 更新正式 Meeting</text>
    <path d="M170 815H485"/><text x="327" y="802" stroke="none" text-anchor="middle">9. 现场出示买家取件码</text><path d="M485 865H1160"/><text x="822" y="852" stroke="none" text-anchor="middle">10. 验证买家码，卖家确认交付</text><path d="M170 915H1160"/><text x="665" y="902" stroke="none" text-anchor="middle">11. 验证卖家码，买家确认收货 → COMPLETED</text>
  </g>
  <rect x="1040" y="460" width="470" height="210" rx="20" fill="#f4c95d" opacity=".15" stroke="#c18e24" stroke-width="2"/><text x="1065" y="492" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="800" fill="#725112">冲突时返回明确提醒，不覆盖原预约</text>
</svg>
