<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">StudentBay 系统用例图</title>
  <desc id="desc">游客、买家、卖家和管理员参与的主要系统用例。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f6f8f3"/><stop offset="1" stop-color="#e8f2ec"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#103a30" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#678078"/></marker>
  </defs>
  <rect width="1600" height="1000" rx="32" fill="url(#bg)"/>
  <text x="70" y="75" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="38" font-weight="800" fill="#10251f">StudentBay 系统用例图</text>
  <text x="70" y="112" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#64736d">校园闲置交易 · 角色与能力边界</text>
  <rect x="300" y="145" width="1000" height="785" rx="28" fill="#fff" stroke="#9fb5a9" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="190" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="800" fill="#195c49">StudentBay 系统边界</text>

  <g font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">
    <g fill="#fff" stroke="#195c49" stroke-width="2">
      <ellipse cx="485" cy="275" rx="132" ry="42"/><ellipse cx="800" cy="275" rx="132" ry="42"/><ellipse cx="1115" cy="275" rx="132" ry="42"/>
      <ellipse cx="485" cy="390" rx="132" ry="42"/><ellipse cx="800" cy="390" rx="132" ry="42"/><ellipse cx="1115" cy="390" rx="132" ry="42"/>
      <ellipse cx="485" cy="505" rx="132" ry="42"/><ellipse cx="800" cy="505" rx="132" ry="42"/><ellipse cx="1115" cy="505" rx="132" ry="42"/>
      <ellipse cx="485" cy="620" rx="132" ry="42"/><ellipse cx="800" cy="620" rx="132" ry="42"/><ellipse cx="1115" cy="620" rx="132" ry="42"/>
      <ellipse cx="485" cy="735" rx="132" ry="42"/><ellipse cx="800" cy="735" rx="132" ry="42"/><ellipse cx="1115" cy="735" rx="132" ry="42"/>
      <ellipse cx="640" cy="850" rx="132" ry="42"/><ellipse cx="960" cy="850" rx="132" ry="42"/>
    </g>
    <g fill="#173a30" font-size="18" font-weight="700">
      <text x="485" y="282">注册 / 登录</text><text x="800" y="282">浏览与智能搜索</text><text x="1115" y="282">收藏 / 留言 / 咨询</text>
      <text x="485" y="397">购物车与多卖家结算</text><text x="800" y="397">支付与取消订单</text><text x="1115" y="397">任务金币与骰子寻宝</text>
      <text x="485" y="512">校园面交与双向码</text><text x="800" y="512">快递预约与物流</text><text x="1115" y="512">退款 / 退货 / 介入</text>
      <text x="485" y="627">双向评价与 Trust Score</text><text x="800" y="627">发布与维护商品</text><text x="1115" y="627">未付款订单改价</text>
      <text x="485" y="742">用户 / 商品 / 举报治理</text><text x="800" y="742">售后审核与执行退款</text><text x="1115" y="742">经营数据可视化</text>
      <text x="640" y="857">风险交易提示</text><text x="960" y="857">订单消息同步</text>
    </g>
  </g>

  <g font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle" fill="#10251f">
    <g transform="translate(115 230)"><circle cx="55" cy="32" r="25" fill="#c9f26a"/><path d="M20 112c4-40 66-40 70 0" fill="none" stroke="#195c49" stroke-width="9" stroke-linecap="round"/><path d="M55 58v48M30 76h50" stroke="#195c49" stroke-width="9" stroke-linecap="round"/><text x="55" y="155" font-size="23" font-weight="800">游客</text></g>
    <g transform="translate(115 510)"><circle cx="55" cy="32" r="25" fill="#c9f26a"/><path d="M20 112c4-40 66-40 70 0M55 58v48M30 76h50" fill="none" stroke="#195c49" stroke-width="9" stroke-linecap="round"/><text x="55" y="155" font-size="23" font-weight="800">买家</text></g>
    <g transform="translate(1375 260)"><circle cx="55" cy="32" r="25" fill="#c9f26a"/><path d="M20 112c4-40 66-40 70 0M55 58v48M30 76h50" fill="none" stroke="#195c49" stroke-width="9" stroke-linecap="round"/><text x="55" y="155" font-size="23" font-weight="800">卖家</text></g>
    <g transform="translate(1375 610)"><circle cx="55" cy="32" r="25" fill="#f4c95d"/><path d="M20 112c4-40 66-40 70 0M55 58v48M30 76h50" fill="none" stroke="#195c49" stroke-width="9" stroke-linecap="round"/><text x="55" y="155" font-size="23" font-weight="800">管理员</text></g>
  </g>

  <g fill="none" stroke="#678078" stroke-width="2.2" marker-end="url(#arrow)" opacity=".9">
    <path d="M205 300C255 290 300 280 350 275"/><path d="M205 330C310 250 520 245 668 270"/>
    <path d="M205 590C290 500 310 420 350 390"/><path d="M205 610C330 550 500 420 668 395"/><path d="M205 630C320 635 330 615 350 615"/><path d="M205 650C350 720 630 550 670 510"/>
    <path d="M1395 370C1320 390 1275 520 1245 615"/><path d="M1395 390C1320 415 1270 395 1245 392"/><path d="M1395 410C1330 480 1290 500 1245 505"/>
    <path d="M1395 730C1330 735 1285 735 1248 735"/><path d="M1395 750C1300 770 1100 760 930 745"/><path d="M1395 770C1320 810 1260 820 1095 845"/>
  </g>
</svg>
