<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>确认订单 - StudentBay</title><link rel="stylesheet" href="/css/app.css"><script defer src="/js/app.js"></script></head><body data-page="checkout"><header id="siteHeader"></header><main class="shell"><div class="steps"><div class="step"><span>1</span>购物车</div><div class="step-line"></div><div class="step active"><span>2</span>确认订单</div><div class="step-line"></div><div class="step"><span>3</span>支付</div></div><div class="page-heading"><div><h1>确认订单</h1><p>核对收货信息、优惠和付款方式。</p></div></div><div class="checkout-layout"><div>
<section class="card card-body"><div class="section-title" style="margin-top:0"><h2>配送方式</h2></div><div class="choice-grid"><label class="choice-option"><input type="radio" name="shipping" value="DELIVERY" checked> 快递配送<small style="display:block;margin:8px 0 0 25px;color:var(--muted)">运费 ¥5.00</small></label><label class="choice-option"><input type="radio" name="shipping" value="PICKUP"> 校内自提<small style="display:block;margin:8px 0 0 25px;color:var(--muted)">与卖家约定地点</small></label></div></section>
<section id="addressSection" class="card card-body" style="margin-top:18px"><div class="section-title" style="margin-top:0"><h2>收货地址</h2><button id="showAddressForm" class="btn btn-outline btn-small" type="button">新增地址</button></div><div id="addressList" class="option-list"></div><form id="addressForm" class="hidden address-form"><input id="addressId" type="hidden"><div class="section-title" style="margin:0"><h3 id="addressFormTitle">新增收货地址</h3></div><div class="form-grid"><input id="recipientName" class="input" placeholder="收货人" maxlength="60" required><input id="recipientPhone" class="input" type="tel" placeholder="联系电话" maxlength="11" inputmode="numeric" pattern="[0-9]{11}" title="请输入 11 位数字手机号" required><input id="addressDetail" class="input span-2" placeholder="校区、宿舍楼或快递站详细地址" maxlength="300" required><label><input id="defaultAddress" type="checkbox"> 设为默认地址</label><div class="form-actions"><button id="cancelAddressEdit" class="btn btn-outline btn-small" type="button">取消</button><button class="btn btn-primary btn-small" type="submit"><span id="addressSubmitText">保存地址</span></button></div></div></form></section>
<section id="pickupSection" class="card card-body pickup-schedule hidden" style="margin-top:18px"><div class="section-title" style="margin-top:0"><div><span class="eyebrow">Meeting</span><h2>约定校园面交</h2><p>同一次结算会按卖家拆单，每张订单都有独立的双向取件码。</p></div></div><div class="pickup-form-grid"><label class="field"><span>日期</span><input id="pickupDate" class="input" type="date" required></label><label class="field"><span>开始时间</span><input id="pickupStartTime" class="input" type="time" value="17:30" required></label><label class="field"><span>结束时间</span><input id="pickupEndTime" class="input" type="time" value="18:00" required></label><label class="field pickup-location-field"><span>面交地点</span><input id="pickupLocation" class="input" maxlength="160" placeholder="Library North Gate" required></label></div></section>
<section class="card card-body price-guard" style="margin-top:18px"><div class="section-title" style="margin-top:0"><div><span class="eyebrow">Price protection</span><h2>价格保护参考</h2><p>提交前对比同类校园挂牌价，信息仅作交易判断参考。</p></div></div><div id="checkoutPriceInsights" class="price-guard-list" aria-live="polite"><div class="price-guard-loading">正在核对市场价格...</div></div></section>
<section class="card card-body" style="margin-top:18px"><div class="section-title" style="margin-top:0"><h2>优惠券</h2></div><div id="couponList" class="option-list"></div></section>
<section class="card card-body" style="margin-top:18px"><div class="section-title" style="margin-top:0"><div><h2>金币抵扣</h2><p>任务中心获得的金币可以直接抵扣订单金额。</p></div><a class="text-button" href="/rewards.html">去赚金币</a></div><label class="coin-use-option"><input id="useCoins" type="checkbox"><span><strong id="coinBalanceText">可用 0 金币</strong><small id="coinUsageText">10 金币可抵 ¥1.00，本单最高抵扣 20%</small></span></label></section>
<section class="card card-body" style="margin-top:18px"><div class="section-title" style="margin-top:0"><h2>支付方式</h2></div><div class="choice-grid"><label class="choice-option"><input type="radio" name="payment" value="WECHAT_PAY" checked> 微信支付</label><label class="choice-option"><input type="radio" name="payment" value="ALIPAY"> 支付宝</label><label class="choice-option"><input type="radio" name="payment" value="CAMPUS_CARD"> 校园卡</label></div></section>
</div><aside class="card card-body summary checkout-summary"><h2 style="margin-top:0">订单汇总</h2><div id="checkoutItems"></div><div id="sellerSplitHint" class="seller-split-hint"></div><div class="summary-row"><span>商品金额</span><strong id="productAmount">¥0.00</strong></div><div class="summary-row"><span>配送费</span><strong id="shippingAmount">¥5.00</strong></div><div class="summary-row"><span>优惠券</span><strong id="discountAmount">-¥0.00</strong></div><div class="summary-row"><span>金币抵扣</span><strong id="coinDiscountAmount">-¥0.00</strong></div><div class="summary-row summary-total"><span>应付合计</span><strong id="payableAmount">¥0.00</strong></div><button id="submitOrder" class="btn btn-primary btn-block" style="margin-top:20px">提交订单</button></aside></div></main><div id="toast" class="toast"></div></body></html>
