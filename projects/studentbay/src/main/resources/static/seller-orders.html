<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卖家订单 - StudentBay</title><link rel="stylesheet" href="/css/app.css?v=day9"><script defer src="/js/app.js?v=day9"></script></head><body data-page="seller-orders"><header id="siteHeader"></header><main class="shell"><div class="page-heading"><div><h1>我卖出的</h1><p>统一处理校园面交、快递配送与买家售后申请，状态会自动同步。</p></div><a class="btn btn-outline" href="/orders.html">我买到的</a></div><div id="sellerOrderList"></div></main><div id="toast" class="toast"></div><div id="courierModal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h3>预约快递取件</h3><button class="icon-btn" data-close-modal>×</button></div><form id="courierForm" class="field" style="gap:16px"><input id="courierOrderId" type="hidden"><div class="field"><label>快递公司</label><select id="courierCompany" class="select"><option>顺丰速运</option><option>京东快递</option><option>中通快递</option><option>圆通速递</option></select></div><div class="field"><label>上门取件时间</label><input id="pickupTime" class="input" type="datetime-local" required></div><button class="btn btn-primary" type="submit">提交预约</button></form></div></div><div id="shipmentModal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h3>确认已发货</h3><button class="icon-btn" data-close-modal>×</button></div><form id="shipmentForm" class="field" style="gap:16px"><input id="shipmentOrderId" type="hidden"><div class="field"><label>快递运单号</label><input id="trackingNumber" class="input" placeholder="填写取件后生成的运单号" required></div><button class="btn btn-primary" type="submit">确认发货</button></form></div></div></body></html>
