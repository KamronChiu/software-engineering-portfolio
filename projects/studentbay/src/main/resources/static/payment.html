<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订单支付 - StudentBay</title><link rel="stylesheet" href="/css/app.css"><script defer src="/js/app.js"></script></head><body data-page="payment"><header id="siteHeader"></header><main class="shell narrow payment-shell"><div class="steps"><div class="step"><span>1</span>购物车</div><div class="step-line"></div><div class="step"><span>2</span>确认订单</div><div class="step-line"></div><div class="step active"><span>3</span>支付</div></div><section class="card payment-stage"><div class="payment-stage-copy"><span class="eyebrow">Secure payment</span><h1>完成这次校园交易</h1><p>一次支付，多卖家订单已在后台安全拆分。</p><div class="payment-trust"><span id="paymentModeLabel">模拟支付</span><span>幂等校验</span><span>交易风险已检查</span></div><div id="paymentRiskAlerts" class="payment-risk-alerts" aria-live="polite"></div></div><div class="payment-terminal"><div class="payment-terminal-head"><span>StudentBay Pay</span><small id="paymentModeBadge">TEST MODE</small></div><div id="paymentOrders" class="payment-order-list"></div><div class="payment-total"><span>待支付</span><strong id="paymentTotal">¥0.00</strong></div><button id="payNow" class="btn btn-primary btn-block payment-button"><span id="payNowLabel">确认支付</span></button><div id="paymentFeedback" class="payment-feedback" role="status" aria-live="polite"></div><a class="payment-later" href="/orders.html">暂不支付，查看订单</a></div></section></main><div id="toast" class="toast"></div></body></html>
