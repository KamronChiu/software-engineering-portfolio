<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="查看你在 StudentBay 最近浏览过的校园闲置商品。">
    <title>最近浏览 - StudentBay</title>
    <link rel="stylesheet" href="/css/app.css">
    <script defer src="/js/app.js"></script>
</head>
<body data-page="browse">
<header id="siteHeader"></header>
<main class="shell">
    <div class="page-heading">
        <div>
            <span class="eyebrow" style="color:var(--campus)">Browse</span>
            <h1>最近浏览</h1>
            <p>看过的商品都在这里，方便回头再对比。</p>
        </div>
        <button id="clearBrowseBtn" class="btn btn-outline" type="button">清空记录</button>
    </div>
    <section id="browseGrid" class="product-grid">
        <div class="product-skeleton"></div><div class="product-skeleton"></div><div class="product-skeleton"></div><div class="product-skeleton"></div>
    </section>
</main>
<footer class="footer">浏览足迹只保存在你的账号下</footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
