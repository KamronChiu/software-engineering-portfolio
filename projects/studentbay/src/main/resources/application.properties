spring.application.name=StudentBay
# 本地 .env 配置自动加载（IDEA/终端任意方式启动均生效；.env 已被 gitignore，不入库）
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/studentbay?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:studentbay}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}
server.servlet.session.store-dir=./target/session-store
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

app.order.payment-timeout-minutes=${ORDER_PAYMENT_TIMEOUT_MINUTES:30}
app.order.timeout-scan-ms=${ORDER_TIMEOUT_SCAN_MS:60000}

# Alipay sandbox: keep keys in environment variables, never commit real secrets.
app.alipay.enabled=${ALIPAY_SANDBOX_ENABLED:false}
app.alipay.gateway-host=${ALIPAY_GATEWAY_HOST:openapi.alipaydev.com}
app.alipay.app-id=${ALIPAY_APP_ID:}
app.alipay.merchant-private-key=${ALIPAY_MERCHANT_PRIVATE_KEY:}
app.alipay.alipay-public-key=${ALIPAY_PUBLIC_KEY:}
app.alipay.base-url=${APP_BASE_URL:http://localhost:8080}

# Optional OpenAI-compatible product intent parser. Local semantic parsing remains available without a key.
app.ai.enabled=${AI_SEARCH_ENABLED:false}
app.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:gpt-4.1-mini}

# ===== AI 商品描述优化（T5.5-T5.8 可选功能，默认关闭，不影响构建与发布） =====
# 默认跟随"AI 搜索"同一套配置（AI_SEARCH_ENABLED/AI_BASE_URL/AI_API_KEY/AI_MODEL）：
# 只要给 AI 搜索配过 key，描述优化开箱即用，无需单独配置；也可用 AI_DESC_* 单独覆盖。
# Provider 按 base-url 自动推断（open.bigmodel.cn -> glm；localhost/127.0.0.1 -> ollama；其他 -> custom）。
#   ollama（离线主方案）：完全免费、断网可演示，无需 key，启动见 scripts/start-ollama.bat
#   glm（在线备选 · 智谱 GLM-4-Flash）：官方免费额度，在 https://open.bigmodel.cn 申请 key
app.ai.desc.enabled=${AI_DESC_ENABLED:${AI_SEARCH_ENABLED:false}}
app.ai.desc.provider=${AI_DESC_PROVIDER:auto}
app.ai.desc.base-url=${AI_DESC_BASE_URL:${AI_BASE_URL:http://localhost:11434/v1}}
app.ai.desc.api-key=${AI_DESC_API_KEY:${AI_API_KEY:}}
app.ai.desc.model=${AI_DESC_MODEL:${AI_MODEL:qwen2.5:3b}}
app.ai.desc.timeout-seconds=${AI_DESC_TIMEOUT_SECONDS:3}
